		<h1>Wall Pipe Weakpoint</h1> 
			<h2>(wallpipeweakpoint)</h2><p>A weak point in the pipe system. An impact (collision with terrain or being rammed by a submarine or creature) can damage or break these, resulting in a water hazard. Needs to be linked to a wall - damage to that wall will make this weak point leak.</p>
