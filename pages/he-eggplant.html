		<h1>Ovoflora</h1> 
			<h2>(he-eggplant)</h2><p>An odd parasitic plant that infects oviparous creatures, replacing their embryos with an egg-like fruit. The infected specimen then lays the plant among its eggs, until it bursts and repeats the cycle. But to a hungry europan, it's an ingredient like any other...</p>
